<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WACC Calculator</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex items-center justify-center p-6">
    <div class="bg-white rounded-xl shadow-lg p-8 max-w-lg w-full">
        <h1 class="text-2xl font-bold text-gray-800 text-center mb-2">WACC Calculator</h1>
        <p class="text-gray-600 text-sm text-center mb-6">Calculate the Weighted Average Cost of Capital for a firm.</p>

        <form action="/" method="POST" class="space-y-4">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="equity">
                    Market Value of Equity ($E)
                </label>
                <input type="number" step="any" id="equity" name="equity" required 
                       placeholder="e.g. 5000000" 
                       value="{{ request.form.get('equity', '') }}"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="debt">
                    Market Value of Debt ($D)
                </label>
                <input type="number" step="any" id="debt" name="debt" required 
                       placeholder="e.g. 2000000" 
                       value="{{ request.form.get('debt', '') }}"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="cost_equity">
                    Cost of Equity (%)
                </label>
                <input type="number" step="any" id="cost_equity" name="cost_equity" required 
                       placeholder="e.g. 8.5" 
                       value="{{ request.form.get('cost_equity', '') }}"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="cost_debt">
                    Cost of Debt (%)
                </label>
                <input type="number" step="any" id="cost_debt" name="cost_debt" required 
                       placeholder="e.g. 4.5" 
                       value="{{ request.form.get('cost_debt', '') }}"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1" for="tax_rate">
                    Corporate Tax Rate (%)
                </label>
                <input type="number" step="any" id="tax_rate" name="tax_rate" required 
                       placeholder="e.g. 21" 
                       value="{{ request.form.get('tax_rate', '') }}"
                       class="w-full px-4 py-2 border rounded-lg focus:ring-2 focus:ring-blue-500 focus:outline-none">
            </div>

            <button type="submit" 
                    class="w-full bg-blue-600 hover:bg-blue-700 text-white font-semibold py-2 px-4 rounded-lg transition duration-200 shadow">
                Calculate WACC
            </button>
        </form>

        <!-- Display Result if calculated -->
        {% if wacc is not none %}
        <div class="mt-6 p-4 bg-green-50 border border-green-200 rounded-lg text-center">
            <h2 class="text-sm font-semibold text-green-800 uppercase tracking-wide">Calculated WACC</h2>
            <p class="text-3xl font-extrabold text-green-600 mt-1">{{ "%.2f"|format(wacc) }}%</p>
        </div>
        {% endif %}

        <!-- Display Error if present -->
        {% if error %}
        <div class="mt-6 p-4 bg-red-50 border border-red-200 rounded-lg text-center">
            <p class="text-sm font-medium text-red-600">{{ error }}</p>
        </div>
        {% endif %}
    </div>
</body>
</html>
